<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="navbar(activePage, isAuthenticated)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">
                <i class="fas fa-server me-2"></i>Version Dashboard
            </a>
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-white d-lg-none me-2" id="themeToggleMobile" onclick="toggleTheme()" title="Переключить тему" style="text-decoration: none; padding: 0.5rem;">
                    <i class="fas fa-moon" id="themeIconMobile"></i>
                </button>
                <th:block th:replace="~{fragments/instructions :: instructionButtonMobile}"></th:block>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                            <i class="fas fa-tachometer-alt me-1"></i>Главная страница
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/servers" th:classappend="${activePage == 'servers' ? 'active' : ''}">
                            <i class="fas fa-server me-1"></i>Серверы
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pods" th:classappend="${activePage == 'pods' ? 'active' : ''}">
                            <i class="fas fa-cube me-1"></i>Поды
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="standsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-link me-1"></i>Ссылки на стенды
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="standsDropdown">
                            <li><a class="dropdown-item" href="#" id="standLinkIft" target="_blank"><i class="fas fa-external-link-alt me-1"></i>IFT</a></li>
                            <li><a class="dropdown-item" href="#" id="standLinkPreprod" target="_blank"><i class="fas fa-external-link-alt me-1"></i>Preprod</a></li>
                            <li><a class="dropdown-item" href="#" id="standLinkLt" target="_blank"><i class="fas fa-external-link-alt me-1"></i>LT</a></li>
                            <li><a class="dropdown-item" href="#" id="standLinkHotfix" target="_blank"><i class="fas fa-external-link-alt me-1"></i>Hotfix</a></li>
                            <li><a class="dropdown-item" href="#" id="standLinkProd" target="_blank"><i class="fas fa-external-link-alt me-1"></i>Prod</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-light btn-sm nav-link border-0" id="themeToggle" onclick="toggleTheme()" title="Переключить тему" style="background: transparent !important; color: #fff !important; padding: 0.5rem 1rem;">
                            <i class="fas fa-moon" id="themeIcon"></i> <span class="ms-1">Тема</span>
                        </button>
                    </li>
                    <th:block th:replace="~{fragments/instructions :: instructionButtonDesktop}"></th:block>
                    <li class="nav-item" th:if="${isAuthenticated == false or isAuthenticated == null}">
                        <a class="nav-link" href="/login" title="Войти в систему">
                            <i class="fas fa-sign-in-alt me-1"></i>Войти
                        </a>
                    </li>
                    <li class="nav-item" th:if="${isAuthenticated == true}">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link border-0" style="background: transparent !important; color: #fff !important; padding: 0.5rem 1rem;" title="Выйти из системы">
                                <i class="fas fa-sign-out-alt me-1"></i>Выйти
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
