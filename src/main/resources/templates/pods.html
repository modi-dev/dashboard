<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" id="htmlRoot" data-context-path="/dashboard">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Dashboard</title>
    
    <!-- Favicon from layout fragment -->
    <th:block th:replace="~{layout :: favicon}"></th:block>
    
    <link th:href="@{/dashboard/css/bootstrap.min.css}" href="/dashboard/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/dashboard/css/all.min.css}" href="/dashboard/css/all.min.css" rel="stylesheet">
    <link th:href="@{/dashboard/css/theme-dark.css}" href="/dashboard/css/theme-dark.css" rel="stylesheet">
    <link th:href="@{/dashboard/css/common.css}" href="/dashboard/css/common.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navigation -->
    <th:block th:replace="~{fragments/navigation :: navbar('pods', ${isAuthenticated})}"></th:block>

    <!-- Main Content -->
    <main class="main-content container-fluid px-4 py-3">

        <!-- Quota Speedometers -->
        <div class="row g-2 mb-4 justify-content-center" th:if="${quotaCpu != null or quotaMemory != null or quotaPods != null or quotaConfigmaps != null or quotaSecrets != null}">
            <div class="col-6 col-md-4 col-lg-2 col-xl-2" th:if="${quotaCpu != null}">
                <div class="card speedometer-card h-100">
                    <div class="card-body">
                        <div id="speedometer-cpu"></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 col-xl-2" th:if="${quotaMemory != null}">
                <div class="card speedometer-card h-100">
                    <div class="card-body">
                        <div id="speedometer-memory"></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 col-xl-2" th:if="${quotaPods != null}">
                <div class="card speedometer-card h-100">
                    <div class="card-body">
                        <div id="speedometer-pods"></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 col-xl-2" th:if="${quotaConfigmaps != null}">
                <div class="card speedometer-card h-100">
                    <div class="card-body">
                        <div id="speedometer-configmaps"></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 col-xl-2" th:if="${quotaSecrets != null}">
                <div class="card speedometer-card h-100">
                    <div class="card-body">
                        <div id="speedometer-secrets"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pods Section -->
        <div class="row">
            <div class="col-12">
                <div th:replace="~{fragments/pods :: podsCard(${pods}, ${kubernetesVersion}, ${kubernetesNamespace}, ${quotaCpu}, ${quotaMemory}, ${quotaPods}, ${quotaConfigmaps}, ${quotaSecrets})}"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer bg-light text-center py-3 mt-auto">
        <div class="container-fluid px-4">
            <span class="text-muted">Version Dashboard <span th:text="${@environment.getProperty('app.version', '1.0.0')}">v1.0.0</span> |
                <a href="/actuator/health" target="_blank">Health</a> | 
                <a href="/actuator/metrics" target="_blank">Metrics</a>
            </span>
        </div>
    </footer>

    <script th:src="@{/dashboard/js/bootstrap.bundle.min.js}" src="/dashboard/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/dashboard/js/app.js}" src="/dashboard/js/app.js"></script>
    <script th:inline="javascript">
        // Передаем значения quota в JavaScript
        window.quotaCpu = /*[[${quotaCpu}]]*/ null;
        window.quotaMemory = /*[[${quotaMemory}]]*/ null;
        window.quotaPods = /*[[${quotaPods}]]*/ null;
        window.quotaConfigmaps = /*[[${quotaConfigmaps}]]*/ null;
        window.quotaSecrets = /*[[${quotaSecrets}]]*/ null;
        
        // Инициализируем спидометры после загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            initSpeedometers();
        });
    </script>
    <div th:replace="~{fragments/instructions :: instructionModal}"></div>
</body>
</html>
