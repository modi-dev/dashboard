<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Pods - Version Dashboard</title>
    
    <!-- Favicon from layout fragment -->
    <th:block th:replace="~{layout :: favicon}"></th:block>
    
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/all.min.css" rel="stylesheet">
    <link href="/css/theme-dark.css" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">
                <i class="fas fa-server me-2"></i>Version Dashboard
            </a>
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-white d-lg-none me-2" id="themeToggleMobile" onclick="toggleTheme()" title="Переключить тему" style="text-decoration: none; padding: 0.5rem;">
                    <i class="fas fa-moon" id="themeIconMobile"></i>
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/servers">
                            <i class="fas fa-server me-1"></i>Servers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/pods">
                            <i class="fas fa-cube me-1"></i>Pods
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button class="btn btn-light btn-sm nav-link border-0" id="themeToggle" onclick="toggleTheme()" title="Переключить тему" style="background: transparent !important; color: #fff !important; padding: 0.5rem 1rem;">
                            <i class="fas fa-moon" id="themeIcon"></i> <span class="ms-1">Тема</span>
                        </button>
                    </li>
                    <li class="nav-item" th:if="${isAuthenticated == false or isAuthenticated == null}">
                        <a class="nav-link" href="/login" title="Войти в систему">
                            <i class="fas fa-sign-in-alt me-1"></i>Войти
                        </a>
                    </li>
                    <li class="nav-item" th:if="${isAuthenticated == true}">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link border-0" style="background: transparent !important; color: #fff !important; padding: 0.5rem 1rem;" title="Выйти из системы">
                                <i class="fas fa-sign-out-alt me-1"></i>Выйти
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content container-fluid px-4 py-3">
        <!-- Statistics Cards -->
        <div class="row g-3 mb-4 justify-content-center">
            <div class="col-md-4 col-lg-3 col-xl-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-cube fa-2x text-primary mb-2"></i>
                        <h5 class="card-title">Всего подов</h5>
                        <h3 class="text-primary" th:text="${totalPods ?: 0}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-3 col-xl-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-gem fa-2x text-warning mb-2"></i>
                        <h5 class="card-title">Уникальных сервисов</h5>
                        <h3 class="text-warning" th:text="${uniqueServices ?: 0}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pods Section -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div class="d-flex align-items-center gap-3 flex-wrap flex-grow-1">
                            <h5 class="mb-0"><i class="fas fa-cube me-2"></i>K8s Pods</h5>
                            <div class="input-group input-group-sm" style="width: 240px;">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" id="podsFilter" class="form-control" placeholder="Фильтр..." aria-label="Фильтр по таблице">
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-2 flex-wrap">
                            <div class="dropdown column-visibility-dropdown" data-bs-auto-close="outside">
                                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="columnVisibilityDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fas fa-columns me-1"></i>Колонки
                                </button>
                                <div class="dropdown-menu dropdown-menu-end p-3 column-visibility-menu" aria-labelledby="columnVisibilityDropdown">
                                    <h6 class="dropdown-header px-0">Отображение столбцов</h6>
                                    <div class="column-toggle-list">
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnName" data-column-key="name" checked>
                                            <label class="form-check-label" for="toggleColumnName">Название</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnPodName" data-column-key="podName" checked>
                                            <label class="form-check-label" for="toggleColumnPodName">POD_NAME</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnVersion" data-column-key="version" checked>
                                            <label class="form-check-label" for="toggleColumnVersion">Версия</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnMsBranch" data-column-key="msBranch" checked>
                                            <label class="form-check-label" for="toggleColumnMsBranch">Ветка сервиса</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnConfigBranch" data-column-key="configBranch" checked>
                                            <label class="form-check-label" for="toggleColumnConfigBranch">Ветка SD</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnGcOptions" data-column-key="gcOptions" checked>
                                            <label class="form-check-label" for="toggleColumnGcOptions">GC Options</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnPort" data-column-key="port" checked>
                                            <label class="form-check-label" for="toggleColumnPort">Порт</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnRestarts" data-column-key="restarts" checked>
                                            <label class="form-check-label" for="toggleColumnRestarts">Рестарты</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnReadyTime" data-column-key="readyTime" checked>
                                            <label class="form-check-label" for="toggleColumnReadyTime">Время до Ready</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnCpu" data-column-key="cpu" checked>
                                            <label class="form-check-label" for="toggleColumnCpu">CPU</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnMemory" data-column-key="memory" checked>
                                            <label class="form-check-label" for="toggleColumnMemory">Память</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnCreationDate" data-column-key="creationDate" checked>
                                            <label class="form-check-label" for="toggleColumnCreationDate">Дата создания</label>
                                        </div>
                                    </div>
                                    <div class="d-grid mt-3">
                                        <button class="btn btn-sm btn-outline-secondary" type="button" id="resetPodsColumns">
                                            <i class="fas fa-undo me-1"></i>Сбросить настройки
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button onclick="refreshPods(event)" class="btn btn-sm btn-outline-primary" title="Обновить информацию о подах">
                                <i class="fas fa-sync-alt me-1"></i>Обновить
                            </button>
                            <a href="/api/pods/export/csv" class="btn btn-sm btn-outline-success" title="Экспорт в CSV">
                                <i class="fas fa-file-csv me-1"></i>Экспорт CSV
                            </a>
                        </div>
                    </div>
                    <div class="card-body p-0" th:replace="~{fragments/pods :: podsTable(${pods}, ${kubernetesVersion})}"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Add Button -->
    <button th:if="${isAuthenticated == true}" class="btn btn-primary btn-add-server" onclick="openSidebar()" title="Добавить сервер">
        <i class="fas fa-plus fa-lg"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Add Server Sidebar -->
    <div class="sidebar" id="addServerSidebar">
        <div class="sidebar-header">
            <h5 class="mb-0"><i class="fas fa-plus me-2"></i>Добавить сервер</h5>
            <button class="btn btn-sm btn-outline-light" onclick="closeSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="sidebar-body">
            <form id="addServerForm">
                <div class="mb-3">
                    <label for="serverName" class="form-label">Название сервера</label>
                    <input type="text" class="form-control" id="serverName" required placeholder="Например: My Server">
                </div>
                
                <div class="mb-3">
                    <label for="serverUrl" class="form-label">URL</label>
                    <input type="url" class="form-control" id="serverUrl" required placeholder="https://example.com">
                </div>
                
                <div class="mb-3">
                    <label for="serverType" class="form-label">Тип сервера</label>
                    <select class="form-select" id="serverType" required>
                        <option value="">Выберите тип</option>
                        <option value="POSTGRES">PostgreSQL</option>
                        <option value="REDIS">Redis</option>
                        <option value="KAFKA">Kafka</option>
                        <option value="ASTRA_LINUX">Astra Linux</option>
                        <option value="OTHER">Другое</option>
                    </select>
                </div>
                
                <div class="mb-3" id="healthcheckField" style="display: none;">
                    <label for="serverHealthcheck" class="form-label">Healthcheck endpoint</label>
                    <input type="text" class="form-control" id="serverHealthcheck" placeholder="/health">
                    <div class="form-text">Обязательно для типа "Другое"</div>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus me-1"></i>Добавить сервер
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="closeSidebar()">
                        <i class="fas fa-times me-1"></i>Отмена
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer bg-light text-center py-3 mt-auto">
        <div class="container-fluid px-4">
            <span class="text-muted">Version Dashboard v1.0.0 | 
                <a href="/actuator/health" target="_blank">Health</a> | 
                <a href="/actuator/metrics" target="_blank">Metrics</a>
            </span>
        </div>
    </footer>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
