<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Pods - Version Dashboard</title>
    
    <!-- Favicon from layout fragment -->
    <th:block th:replace="~{layout :: favicon}"></th:block>
    
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/all.min.css" rel="stylesheet">
    <link href="/css/theme-dark.css" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">
                <i class="fas fa-server me-2"></i>Version Dashboard
            </a>
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-white d-lg-none me-2" id="themeToggleMobile" onclick="toggleTheme()" title="Переключить тему" style="text-decoration: none; padding: 0.5rem;">
                    <i class="fas fa-moon" id="themeIconMobile"></i>
                </button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/servers">
                            <i class="fas fa-server me-1"></i>Servers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/pods">
                            <i class="fas fa-cube me-1"></i>Pods
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button class="btn btn-light btn-sm nav-link border-0" id="themeToggle" onclick="toggleTheme()" title="Переключить тему" style="background: transparent !important; color: #fff !important; padding: 0.5rem 1rem;">
                            <i class="fas fa-moon" id="themeIcon"></i> <span class="ms-1">Тема</span>
                        </button>
                    </li>
                    <li class="nav-item" th:if="${isAuthenticated == false or isAuthenticated == null}">
                        <a class="nav-link" href="/login" title="Войти в систему">
                            <i class="fas fa-sign-in-alt me-1"></i>Войти
                        </a>
                    </li>
                    <li class="nav-item" th:if="${isAuthenticated == true}">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link border-0" style="background: transparent !important; color: #fff !important; padding: 0.5rem 1rem;" title="Выйти из системы">
                                <i class="fas fa-sign-out-alt me-1"></i>Выйти
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content container-fluid px-4 py-3">
        <!-- Statistics Cards -->
        <div class="row g-3 mb-4 justify-content-center">
            <div class="col-md-4 col-lg-3 col-xl-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-cube fa-2x text-primary mb-2"></i>
                        <h5 class="card-title">Всего подов</h5>
                        <h3 class="text-primary" th:text="${totalPods ?: 0}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-lg-3 col-xl-3">
                <div class="card text-center h-100">
                    <div class="card-body">
                        <i class="fas fa-gem fa-2x text-warning mb-2"></i>
                        <h5 class="card-title">Уникальных сервисов</h5>
                        <h3 class="text-warning" th:text="${uniqueServices ?: 0}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pods Section -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div class="d-flex align-items-center gap-3 flex-wrap flex-grow-1">
                            <h5 class="mb-0"><i class="fas fa-cube me-2"></i>K8s Pods</h5>
                            <div class="input-group input-group-sm" style="width: 240px;">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" id="podsFilter" class="form-control" placeholder="Фильтр..." aria-label="Фильтр по таблице">
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-2 flex-wrap">
                            <div class="dropdown column-visibility-dropdown" data-bs-auto-close="outside">
                                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="columnVisibilityDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fas fa-columns me-1"></i>Колонки
                                </button>
                                <div class="dropdown-menu dropdown-menu-end p-3 column-visibility-menu" aria-labelledby="columnVisibilityDropdown">
                                    <h6 class="dropdown-header px-0">Отображение столбцов</h6>
                                    <div class="column-toggle-list">
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnName" data-column-key="name" checked>
                                            <label class="form-check-label" for="toggleColumnName">Название</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnPodName" data-column-key="podName" checked>
                                            <label class="form-check-label" for="toggleColumnPodName">POD_NAME</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnVersion" data-column-key="version" checked>
                                            <label class="form-check-label" for="toggleColumnVersion">Версия</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnMsBranch" data-column-key="msBranch" checked>
                                            <label class="form-check-label" for="toggleColumnMsBranch">Ветка сервиса</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnConfigBranch" data-column-key="configBranch" checked>
                                            <label class="form-check-label" for="toggleColumnConfigBranch">Ветка SD</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnGcOptions" data-column-key="gcOptions" checked>
                                            <label class="form-check-label" for="toggleColumnGcOptions">GC Options</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnPort" data-column-key="port" checked>
                                            <label class="form-check-label" for="toggleColumnPort">Порт</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnRestarts" data-column-key="restarts" checked>
                                            <label class="form-check-label" for="toggleColumnRestarts">Рестарты</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnReadyTime" data-column-key="readyTime" checked>
                                            <label class="form-check-label" for="toggleColumnReadyTime">Время до Ready</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnCpu" data-column-key="cpu" checked>
                                            <label class="form-check-label" for="toggleColumnCpu">CPU</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnMemory" data-column-key="memory" checked>
                                            <label class="form-check-label" for="toggleColumnMemory">Память</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input column-toggle" type="checkbox" value="" id="toggleColumnCreationDate" data-column-key="creationDate" checked>
                                            <label class="form-check-label" for="toggleColumnCreationDate">Дата создания</label>
                                        </div>
                                    </div>
                                    <div class="d-grid mt-3">
                                        <button class="btn btn-sm btn-outline-secondary" type="button" id="resetPodsColumns">
                                            <i class="fas fa-undo me-1"></i>Сбросить настройки
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button onclick="refreshPods()" class="btn btn-sm btn-outline-primary" title="Обновить информацию о подах">
                                <i class="fas fa-sync-alt me-1"></i>Обновить
                            </button>
                            <a href="/api/pods/export/csv" class="btn btn-sm btn-outline-success" title="Экспорт в CSV">
                                <i class="fas fa-file-csv me-1"></i>Экспорт CSV
                            </a>
                        </div>
                    </div>
                    <div class="card-body p-0" th:replace="~{fragments/pods :: podsTable(${pods}, ${kubernetesVersion})}"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Add Button -->
    <button th:if="${isAuthenticated == true}" class="btn btn-primary btn-add-server" onclick="openSidebar()" title="Добавить сервер">
        <i class="fas fa-plus fa-lg"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Add Server Sidebar -->
    <div class="sidebar" id="addServerSidebar">
        <div class="sidebar-header">
            <h5 class="mb-0"><i class="fas fa-plus me-2"></i>Добавить сервер</h5>
            <button class="btn btn-sm btn-outline-light" onclick="closeSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="sidebar-body">
            <form id="addServerForm">
                <div class="mb-3">
                    <label for="serverName" class="form-label">Название сервера</label>
                    <input type="text" class="form-control" id="serverName" required placeholder="Например: My Server">
                </div>
                
                <div class="mb-3">
                    <label for="serverUrl" class="form-label">URL</label>
                    <input type="url" class="form-control" id="serverUrl" required placeholder="https://example.com">
                </div>
                
                <div class="mb-3">
                    <label for="serverType" class="form-label">Тип сервера</label>
                    <select class="form-select" id="serverType" required onchange="toggleHealthcheck()">
                        <option value="">Выберите тип</option>
                        <option value="POSTGRES">PostgreSQL</option>
                        <option value="REDIS">Redis</option>
                        <option value="KAFKA">Kafka</option>
                        <option value="ASTRA_LINUX">Astra Linux</option>
                        <option value="OTHER">Другое</option>
                    </select>
                </div>
                
                <div class="mb-3" id="healthcheckField" style="display: none;">
                    <label for="serverHealthcheck" class="form-label">Healthcheck endpoint</label>
                    <input type="text" class="form-control" id="serverHealthcheck" placeholder="/health">
                    <div class="form-text">Обязательно для типа "Другое"</div>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus me-1"></i>Добавить сервер
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="closeSidebar()">
                        <i class="fas fa-times me-1"></i>Отмена
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer bg-light text-center py-3 mt-auto">
        <div class="container-fluid px-4">
            <span class="text-muted">Version Dashboard v1.0.0 | 
                <a href="/actuator/health" target="_blank">Health</a> | 
                <a href="/actuator/metrics" target="_blank">Metrics</a>
            </span>
        </div>
    </footer>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            // No need to load data via JS, Thymeleaf handles it
            // loadServers();
            // loadPods();
            
            // Add form submission handler
            document.getElementById('addServerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                addServer();
            });
            
            // Add keyboard handler for Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeSidebar();
                }
            });
        });

        // Sidebar functions
        function openSidebar() {
            document.getElementById('addServerSidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('show');
            document.querySelector('.main-content').classList.add('sidebar-open');
            document.body.style.overflow = 'hidden';
        }
        
        function closeSidebar() {
            document.getElementById('addServerSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show');
            document.querySelector('.main-content').classList.remove('sidebar-open');
            document.body.style.overflow = 'auto';
            // Reset form
            document.getElementById('addServerForm').reset();
            toggleHealthcheck();
        }
        
        // Toggle healthcheck field visibility
        function toggleHealthcheck() {
            const serverType = document.getElementById('serverType').value;
            const healthcheckField = document.getElementById('healthcheckField');
            const healthcheckInput = document.getElementById('serverHealthcheck');
            
            if (serverType === 'OTHER') {
                healthcheckField.style.display = 'block';
                healthcheckInput.required = true;
            } else {
                healthcheckField.style.display = 'none';
                healthcheckInput.required = false;
            }
        }

        // Add server function
        function addServer() {
            const serverData = {
                name: document.getElementById('serverName').value,
                url: document.getElementById('serverUrl').value,
                type: document.getElementById('serverType').value
            };
            
            // Add healthcheck if type is OTHER
            if (serverData.type === 'OTHER') {
                serverData.healthcheck = document.getElementById('serverHealthcheck').value;
            }
            
            fetch('/api/servers', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(serverData),
                credentials: 'same-origin'
            })
            .then(response => {
                if (response.status === 401 || response.status === 403) {
                    window.location.href = '/login';
                    return null;
                }
                return response.json();
            })
            .then(data => {
                if (!data) return;
                if (data.success) {
                    // Close sidebar
                    closeSidebar();
                    // Reload page to reflect changes
                    location.reload(); 
                    // Show success message
                    showNotification('Сервер успешно добавлен!', 'success');
                } else {
                    showNotification('Ошибка: ' + (data.error || data.message || 'Неизвестная ошибка'), 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Произошла ошибка при добавлении сервера');
            });
        }

        // Functions showNotification, deleteServer, refreshPods are in app.js

        // Table filter for pods (works with grouped rows)
        (function initPodsFilter() {
            const input = document.getElementById('podsFilter');
            if (!input) return;
            input.addEventListener('input', function() {
                const query = input.value.trim().toLowerCase();
                const table = document.getElementById('podsTable');
                if (!table) return;
                const rows = table.querySelectorAll('tbody tr');
                
                rows.forEach(row => {
                    const isGroup = row.getAttribute('data-is-group') === 'true';
                    const isGroupItem = row.getAttribute('data-is-group-item') === 'true';
                    const text = row.innerText.toLowerCase();
                    const matches = text.includes(query);
                    
                    if (isGroup) {
                        // For grouped rows, check if any child matches
                        const groupName = row.getAttribute('data-group-name');
                        const groupItems = table.querySelectorAll(`tr[data-group-name="${groupName}"][data-is-group-item="true"]`);
                        let anyChildMatches = matches;
                        
                        groupItems.forEach(item => {
                            if (item.innerText.toLowerCase().includes(query)) {
                                anyChildMatches = true;
                            }
                        });
                        
                        if (anyChildMatches) {
                            row.style.display = '';
                            // Show matching child items if group is expanded
                            if (row.getAttribute('data-expanded') === 'true') {
                                groupItems.forEach(item => {
                                    if (item.innerText.toLowerCase().includes(query)) {
                                        item.style.display = '';
                                    } else {
                                        item.style.display = 'none';
                                    }
                                });
                            }
                        } else {
                            row.style.display = 'none';
                            groupItems.forEach(item => item.style.display = 'none');
                        }
                    } else if (isGroupItem) {
                        // Group items are handled by parent group
                        // Only show if parent is expanded and matches
                        const groupName = row.getAttribute('data-group-name');
                        const groupRow = table.querySelector(`tr[data-group-name="${groupName}"][data-is-group="true"]`);
                        if (groupRow && groupRow.getAttribute('data-expanded') === 'true' && matches) {
                            row.style.display = '';
                        }
                    } else {
                        // Regular row
                        row.style.display = matches ? '' : 'none';
                    }
                });
            });
        })();

        // Group pods by name
        (function groupPods() {
            const table = document.getElementById('podsTable');
            if (!table) return;
            
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            
            // Group rows by pod name
            const groups = {};
            rows.forEach(row => {
                const podName = row.getAttribute('data-pod-name');
                if (!groups[podName]) {
                    groups[podName] = [];
                }
                groups[podName].push(row);
            });
            
            // Clear tbody
            tbody.innerHTML = '';
            
            // Process each group
            Object.keys(groups).sort().forEach(name => {
                const groupRows = groups[name];
                
                if (groupRows.length > 1) {
                    // Create grouped row (using first pod as template)
                    const firstRow = groupRows[0];
                    const groupedRow = firstRow.cloneNode(true);
                    groupedRow.setAttribute('data-group-name', name);
                    groupedRow.setAttribute('data-is-group', 'true');
                    groupedRow.setAttribute('data-expanded', 'false');
                    
                    // Add expand/collapse button
                    const firstCell = groupedRow.querySelector('td:first-child');
                    firstCell.innerHTML = '<button class="btn btn-sm btn-link p-0" onclick="togglePodGroup(this)" style="min-width: 20px;"><i class="fas fa-chevron-right"></i></button>';
                    
                    // Clear detail columns content but keep structure
                    const detailCells = Array.from(groupedRow.querySelectorAll('.pod-detail-col'));
                    detailCells.forEach(cell => {
                        // Store original content for potential future use
                        cell.setAttribute('data-original-html', cell.innerHTML);
                        // Clear content but keep the cell to maintain table structure
                        cell.innerHTML = '';
                        // Hide the cell visually but keep it in DOM
                        cell.style.visibility = 'hidden';
                        cell.style.width = '0';
                        cell.style.padding = '0';
                        cell.style.border = 'none';
                    });
                    
                    // Mark individual rows
                    groupRows.forEach(row => {
                        row.setAttribute('data-group-name', name);
                        row.setAttribute('data-is-group-item', 'true');
                        row.style.display = 'none';
                        row.querySelectorAll('td:first-child').forEach(cell => {
                            cell.innerHTML = ''; // Empty first cell for indentation
                        });
                    });
                    
                    // Add count badge to name
                    const nameCell = groupedRow.querySelector('td:nth-child(2)');
                    const badge = document.createElement('span');
                    badge.className = 'badge bg-primary ms-2';
                    badge.textContent = groupRows.length;
                    nameCell.querySelector('strong').appendChild(badge);
                    
                    // Append grouped row and all individual rows
                    tbody.appendChild(groupedRow);
                    groupRows.forEach(row => tbody.appendChild(row));
                } else {
                    // Single pod, no grouping needed
                    const row = groupRows[0];
                    row.querySelector('td:first-child').innerHTML = '';
                    tbody.appendChild(row);
                }
            });
        })();

        const PODS_COLUMN_SETTINGS_KEY = 'podsTableColumnSettings';

        function getPodsColumnSettings() {
            const defaultSettings = { visibility: {}, widths: {} };
            try {
                const raw = localStorage.getItem(PODS_COLUMN_SETTINGS_KEY);
                if (!raw) {
                    return defaultSettings;
                }
                const parsed = JSON.parse(raw);
                return {
                    visibility: parsed.visibility || {},
                    widths: parsed.widths || {}
                };
            } catch (error) {
                console.warn('Не удалось загрузить настройки колонок подов:', error);
                return defaultSettings;
            }
        }

        function savePodsColumnSettings(settings) {
            localStorage.setItem(PODS_COLUMN_SETTINGS_KEY, JSON.stringify(settings));
        }

        function applyColumnVisibility(table, columnKey, visible) {
            const cells = table.querySelectorAll(`[data-column-key="${columnKey}"]`);
            cells.forEach(cell => {
                if (visible) {
                    cell.classList.remove('column-hidden');
                } else {
                    cell.classList.add('column-hidden');
                }
            });
        }

        function applyColumnWidth(table, columnKey, width) {
            if (width === undefined || width === null) {
                return;
            }
            const numericWidth = typeof width === 'number' ? width : parseInt(width, 10);
            if (Number.isNaN(numericWidth) || numericWidth <= 0) {
                return;
            }
            const widthPx = `${numericWidth}px`;
            const cells = table.querySelectorAll(`[data-column-key="${columnKey}"]`);
            if (cells.length === 0) {
                return;
            }

            table.classList.add('pods-table-fixed');
            cells.forEach(cell => {
                cell.style.width = widthPx;
                cell.style.minWidth = widthPx;
                cell.style.maxWidth = widthPx;
            });
        }

        function clearColumnWidth(table, columnKey) {
            const cells = table.querySelectorAll(`[data-column-key="${columnKey}"]`);
            cells.forEach(cell => {
                cell.style.width = '';
                cell.style.minWidth = '';
                cell.style.maxWidth = '';
            });
        }

        function attachColumnResizer(table, headerCell, columnKey, settings) {
            if (!headerCell || !columnKey) {
                return;
            }
            if (headerCell.querySelector('.column-resizer')) {
                return;
            }

            const resizer = document.createElement('span');
            resizer.className = 'column-resizer';
            headerCell.appendChild(resizer);

            let startX = 0;
            let startWidth = 0;
            let lastWidth = 0;

            const onMouseMove = (event) => {
                const delta = event.clientX - startX;
                let newWidth = startWidth + delta;
                if (newWidth < 60) {
                    newWidth = 60;
                }
                lastWidth = newWidth;
                applyColumnWidth(table, columnKey, newWidth);
            };

            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                document.body.classList.remove('column-resize-active');
                if (lastWidth > 0) {
                    settings.widths[columnKey] = Math.round(lastWidth);
                    savePodsColumnSettings(settings);
                }
            };

            resizer.addEventListener('mousedown', (event) => {
                event.preventDefault();
                event.stopPropagation();
                startX = event.clientX;
                startWidth = headerCell.offsetWidth;
                lastWidth = startWidth;
                document.body.classList.add('column-resize-active');
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        (function initPodsColumnControls() {
            const table = document.getElementById('podsTable');
            if (!table) {
                return;
            }
            const settings = getPodsColumnSettings();
            const headerCells = Array.from(table.querySelectorAll('thead th[data-column-key]'));

            headerCells.forEach(headerCell => {
                const columnKey = headerCell.dataset.columnKey;
                const visibility = Object.prototype.hasOwnProperty.call(settings.visibility, columnKey)
                    ? settings.visibility[columnKey]
                    : true;
                const storedWidth = settings.widths[columnKey];

                applyColumnVisibility(table, columnKey, visibility);
                if (storedWidth) {
                    applyColumnWidth(table, columnKey, storedWidth);
                }

                const checkbox = document.querySelector(`.column-toggle[data-column-key="${columnKey}"]`);
                if (checkbox) {
                    checkbox.checked = visibility;
                }

                attachColumnResizer(table, headerCell, columnKey, settings);
            });

            const anyWidthSet = Object.keys(settings.widths || {}).length > 0;
            if (!anyWidthSet) {
                table.classList.remove('pods-table-fixed');
            }

            document.querySelectorAll('.column-toggle').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const columnKey = this.dataset.columnKey;
                    const visible = this.checked;
                    applyColumnVisibility(table, columnKey, visible);
                    settings.visibility[columnKey] = visible;
                    savePodsColumnSettings(settings);
                });
            });

            const resetButton = document.getElementById('resetPodsColumns');
            if (resetButton) {
                resetButton.addEventListener('click', function() {
                    const checkboxes = document.querySelectorAll('.column-toggle');
                    checkboxes.forEach(checkbox => {
                        checkbox.checked = true;
                        const key = checkbox.dataset.columnKey;
                        applyColumnVisibility(table, key, true);
                        clearColumnWidth(table, key);
                    });
                    table.classList.remove('pods-table-fixed');
                    settings.visibility = {};
                    settings.widths = {};
                    savePodsColumnSettings(settings);
                });
            }
        })();

        // Toggle pod group expand/collapse
        function togglePodGroup(button) {
            const row = button.closest('tr');
            const groupName = row.getAttribute('data-group-name');
            const isExpanded = row.getAttribute('data-expanded') === 'true';
            const table = document.getElementById('podsTable');
            
            // Update icon
            const icon = button.querySelector('i');
            if (isExpanded) {
                icon.className = 'fas fa-chevron-right';
                row.setAttribute('data-expanded', 'false');
                
                // Hide detail columns in grouped row (clear content and hide visually)
                const detailCells = Array.from(row.querySelectorAll('.pod-detail-col'));
                detailCells.forEach(cell => {
                    cell.setAttribute('data-original-html', cell.innerHTML);
                    cell.innerHTML = '';
                    cell.style.visibility = 'hidden';
                    cell.style.width = '0';
                    cell.style.padding = '0';
                    cell.style.border = 'none';
                });
                
                // Hide individual rows
                const allRows = table.querySelectorAll(`tr[data-group-name="${groupName}"][data-is-group-item="true"]`);
                allRows.forEach(r => r.style.display = 'none');
            } else {
                icon.className = 'fas fa-chevron-down';
                row.setAttribute('data-expanded', 'true');
                
                // Show detail columns in grouped row (with placeholder values)
                const detailCells = Array.from(row.querySelectorAll('.pod-detail-col'));
                detailCells.forEach(cell => {
                    cell.innerHTML = '-';
                    cell.style.visibility = '';
                    cell.style.width = '';
                    cell.style.padding = '';
                    cell.style.border = '';
                });
                
                // Show individual rows
                const allRows = table.querySelectorAll(`tr[data-group-name="${groupName}"][data-is-group-item="true"]`);
                allRows.forEach(r => r.style.display = '');
            }
        }
        
        // Make togglePodGroup globally available
        window.togglePodGroup = togglePodGroup;
    </script>
</body>
</html>
